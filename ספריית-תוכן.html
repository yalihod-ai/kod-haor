<script>
const CH=[{"title": "מה זו קוסמטיקה טבעית", "type": "content", "paras": ["אחד הסודות היותר גלויים בעולם הקוסמטיקה, האופנה והבריאות, הוא סוד הקוסמטיקה הטבעית. בחברה מתועשת וטכנולוגית כמו שלנו, המבקשת \"לחזור לטבע\" ולאמץ אורח חיים בריא, כבר אי אפשר להתעלם מהעובדות: לקוסמטיקה הטבעית, השואבת את חומרי הגלם שלה מהאדמה, מהצומח ומהחי, יש יתרונות ברורים על פני מוצרי קוסמטיקה סינתטיים, המשלבים חומרים כימיים ותוספים שאינם אורגניים. קוסמטיקה היא נִראות, חזות וטיפוח העור, הן בשכבה העליונה והן בשכבות התחתונות והעמוקות שלו. מדפי החנויות מוצפים בתכשירי טיפוח תעשייתיים המבטיחים לנו תוצאות נפלאות. אז מדוע בעצם הקוסמטיקה הטבעית היא הבחירה הבריאה, הנכונה והטובה ביותר עבור כל אחד ואחת מאיתנו?", "התשובה פשוטה. ממש כמו תזונה בריאה, בהשוואה למזון תעשייתי - כך גם הקוסמטיקה הטבעית חוסכת מאיתנו תוספים כימיים ותעשייתיים מיותרים ואף מזיקים, ומעניקה לגופנו רק את מה שהוא זקוק לו: מינרלים, ויטמינים ותוספים החיוניים לשיפור מצב הגוף, לחוסנו ולשיקום אלמנטים פגועים או ניזוקים על גבי שכבות העור השונות. רבים מאיתנו סובלים מפיגמנטציה, נזקי שמש, מצלקות או מקמטים שונים באזורים בולטים לעין. אחת המטרות הראשוניות של כל קוסמטיקה רפואית, פרא-רפואית או אסתטית, היא לשפר מצב קיים אם לא לתקנו לחלוטין.", "השימוש בעזרים חיצוניים כמו קרמים, משחות ומוצרי טיפוח נועד לסייע במאבק היומיומי כנגד תופעות אלו. כאשר מדובר בקוסמטיקה טבעית, הרי שההתמודדות קלה ופשוטה יותר, מכיוון שלחומרים שהעניק לנו הטבע יש את התכונות הנכונות ביותר לטיפול ולטיפוח בריא ובטוח, מבלי לחשוש מתופעות לוואי או מנזקים עתידיים בלתי ידועים.", "מוצרי קוסמטיקה המופקים בבית, מחומרים בריאים המתאימים לנו – ולא בשרשרת טכנולוגית או בפס ייצור מוכוון מכירות, הם המוצרים האיכותיים והטובים ביותר לשימוש. כמה טוב לדעת, שכיום חומרי הגלם והמוצרים הללו זמינים מתמיד. השימוש בהם כדאי ומומלץ למי שרוצה להמשיך ולהיראות הכי טוב שניתן – מבלי להתפשר על הבריאות. כשאת מבקשת לרכוש או להזמין מוצר קוסמטיקה טבעית, חשוב לוודא כי הוא מכיל מרכיבים טבעיים ובריאים ללא תוספים וללא רכיבים מלאכותיים כלשהם. דרך נפלאה להבטיח זאת, וגם ליהנות מחדוות היצירה, היא להרכיב בעצמך תכשירי קוסמטיקה מחומרים טבעיים נטו. כי לחומר גלם טבעי איכותי אין צורך להוסיף מאום; כל התכונות הטובות שלו כבר בפנים!"]}, {"title": "חומרי גלם לקוסמטיקה טבעית", "type": "content", "paras": ["למוצרי הקוסמטיקה הטבעיים יכולות נפלאות בהגנה על עורנו, וקל להבין מדוע: הטבע תמיד ידע להגן ולשמור על עצמו – הן מבחינת חוסן, שרידות ויכולת לעמוד בתנאי אקלים לא פשוטים; הן מבחינת שמירה על מראה חיצוני מרהיב, רענן ויפיפה. את כל היכולות הללו אפשר ורצוי כיום לספק לעצמנו וליהנות ממראה מטופח, זוהר ורענן מבלי להסתכן בתופעות לוואי או נזקים עתידיים עקב שימוש בתכשירים מלאכותיים או בתוספות כימיות. עד לפני שנים ספורות רווחה הדעה, שדבר אינו יכול לחלחל דרך העור ולהגיע למחזור הדם.", "כיום, כל שיטות הרפואה מכירות בכושר הספיגה של העור ובכך שתכשירי הטיפוח נספגים בגוף, ברוב המקרים, ומשפיעים עליו לא פחות מהמזון הנקלט דרך הפה. מכיוון שנשים הן הצרכן העיקרי של מוצרי קוסמטיקה, כאשר כל אישה עושה שימוש יומי בכ-15 מוצרים שונים בממוצע – ברור כי הקהל הנשי חשוף יותר לסכנות הכימיקלים הסינתטיים. החל במשחת השיניים, דרך הדאודורנט, השמפו והקרמים וכלה בתכשירי האיפור – חשוב לדעת במה אנו מזינות את גופנו והאם אנו מעניקות לו את האיכויות שהוא ראוי להן. כיום, כאשר עולם הטיפוח והחן פתוח בפני כולם – חשוב שכולנו, נשים וגברים, נכיר ונפנים את החשיבות שבשימוש במוצרי קוסמטיקה טבעית, גם לשיפור ההווה ובעיקר למען העתיד.", "בעוד שאת המוצרים הסטנדרטיים עדיין מוקדם לנתח ולאפיין מבחינת השפעותיהם ארוכות הטווח, הרי שהטבע כבר מוכר וגלוי לנו כתוצאה מאלפי שנים של מחקר, ניסוי ובדיקה. הגוף שלנו אינו מעבדה, ולא מומלץ לנסות עליו חומרים ותכשירים שהשפעתם המתמשכת אינה ידועה. מוצרי קוסמטיקה טבעיים מנטרלים את \"אלמנט ההפתעה\", ואפשר להיות בטוחים ושקטים בשימוש בהם.", "איך נדע מה טבעי באמת?", "לא מעט מוצרי קוסמטיקה מתהדרים בהגדרה \"טבעי\", אך בפועל מכילים חומרים סינתטיים בכמות זו או אחרת. מוצרים רבים המתיימרים להיות \"מוצרי קוסמטיקה טבעיים\" כוללים, לדוגמה, כמות קטנה מאוד של שמן אתרי או שמן צמחי המקנים את \"הרושם הטבעי\" הרצוי, אולם למעשה רוב מרכיביהם הם כימיקלים סינתטיים. חומרי גלם טבעיים באמת ניתן למצוא רק בין שלוש הקטגוריות הבאות:", "צמחיים: חומרים המורכבים/מופקים ממרכיבים צמחיים בלבד כגון חמאת קקאו, שמן שקדים, צמחי מרפא, פרחים, שמנים אתריים ועוד.", "תוצרי בעלי חיים: חומרים כגון שעוות דבורים, חלב, יוגורט, דבש וכדומה.", "מינרלים: חומרים כגון חמרים, בוץ ים המלח ומלחי ים.", "חשוב לדעת שהמחיר אינו מעיד על טיב המוצר וגם לא על היותו מוצר קוסמטי טבעי.", "רוב התכשירים הקוסמטיים הקיימים בשוק – החל בתכשירים הזולים וכלה ביקרים, מורכבים מחומרים דומים שמקורם בתעשיית הנפט ובתהליכים כימיים מלאכותיים.", "בעיות עור שונות כמו דלקות, פריחה, אדמומיות וצריבה, עשויות לפחות ואף להיעלם עם המעבר לשימוש במוצרי קוסמטיקה טבעית, ועם הפסקת השימוש במוצרים המכילים מרכיבים מתעשיית הנפט ומרכיבים סינתטיים כגון שמן מינרלי, SLS, חומרי ריח סינתטיים ועוד.", "כשאת מכינה בעצמך את מוצרי הקוסמטיקה הטבעיים שלך, את נהנית מכל היתרונות:", "• לדעת בדיוק מה יש בתוך המוצר.", "• להתאים באופן המדויק ביותר את התכשיר לצורכי העור שלך.", "• לבחור את הריח שעושה לך את זה.", "• להחליט באילו חומרים להשתמש ובאילו לא.", "• להבטיח שהמוצרים שלך טבעיים וטריים במאה אחוז.", "• להימנע ממרכיבים אלרגניים עבורך.", "• לבחור את הקופסאות והאריזה.", "• להכין מתנות נפלאות שירשימו את החברות והמשפחה.", "• ליהנות מחיסכון מצטבר של הרבה כסף.", "• לחוות את התחושה הנפלאה של \"להכין לבד\"!", "טיפוח", "כשגרת", "חיים"]}, {"title": "שגרת טיפוח וטיפים", "type": "content", "paras": ["שגרת הטיפוח האישית שלך", "שגרת טיפוח כוללת ניקוי של העור (לרוב פעם ביום) והזנתו על בסיס יומי, ופעם בשבוע ניקוי הכולל פילינג ומסכה. כאשר אנו מדברים על עור אשר אינו סובל מבעיות מיוחדות ונמצא בקטגוריות של שמן–רגיל–יבש–מעורב, שגרת הטיפוח היומית / שבועית דומה, תוך התאמה אישית של החומרים. חשיבותה טמונה ביכולתה לשמור על עורך בריא וחיוני לאורך זמן.", "ניקוי", "ניקוי יומי של העור הוא המפתח. שאריות איפור, אבק, זיהום אוויר, עשן סיגריות – כל אלו מזיקים לעור שלנו ועלינו להסיר אותם מעורנו בסוף כל יום ולרענן אותו. התאימי את דרך הניקוי לסוג העור: אם העור יבש, הקפידי על שימוש בסבונים עדינים ללא SLS המייבש את העור. השתמשי גם בחלב פנים. שילוב של טיפול במים חמים וקרים לסירוגין יעיל גם כן: לאחר הסרת האיפור וניקוי העור יש לשטוף את העור במים חמים, המסירים שאריות לכלוך ופותחים נקבוביות, ולאחר מכן במים קרים המכווצים את הנקבוביות. שטפי במים חמים וקרים לסירוגין. שלוש פעמים וסיימי במים קרים, כאשר המטרה היא להמריץ את מערכת הדם והלימפה.", "מסכה שבועית", "למסכה תפקיד של ספיחת רעלים וכיווץ, או מנגד, הזנה. התאמת המסכה לסוג עורך חשובה במיוחד. אם עורך יבש, מומלץ להשתמש במסכת ספיחה עדינה שלא תייבש, ובעיקר במסכות הזנה להחדרת לחות. (פורמולת שמנים עשירה גם תעשה את העבודה). אם עורך שמן או סובל מפצעונים, חשוב לעשות מסכת כיווץ וספיחה יותר מפעם בשבוע. הקוסמטיקה הטבעית עושה שימוש נרחב במסכות חמר, הן נפלאות והתוצאות מיידיות.", "פילינג שבועי", "להסרת תאי עור מתים יש חשיבות גדולה בשגרת הטיפוח שלך. מי שמשתמשת בפילינג מכני (גרגרים) על בסיס שבועי, רואה תוצאות. יש להתאים את גודל הגרגר לסוג עורך ולעסות בעדינות. התוצאה הינה עור נקי וחלק יותר. חשבי על כך שגברים מבוגרים נראים לרוב צעירים מנשותיהם. עור הלחיים והלסת נראה צעיר יותר מעור המצח. הסיבה היא פעולת הגילוח היומיומית, הנוטה להסיר תאי עור מתים ועל ידי כך תורמת להתחדשות העור – נקודה למחשבה.", "לחות והזנה", "כל אחת זקוקה לקרם לחות המכיל מיום חיצוני והזנה - רכיבים תזונתיים. גם עור שמן זקוק ללחות ואפילו לרמה מסוימת של שמן. מי שלא משתמשת בקרם על בסיס יומיומי מחסירה מהעור שלה. זיהום אוויר, מזג אוויר, חדרים מחוממים וממוזגים, עשן סיגריות, מים קשים, איפור ועוד פוגעים בעור בקביעות. מטרת הקרם להגן על העור ולספק לו רכיבים חיוניים על בסיס קבוע על מנת שלא ייווצרו בו חוסרים. הקפידי על שימוש בקרם המתאים לסוג עורך ומכיל רכיבים בריאים וחיוניים.", "הימנעות מחשיפה לא מבוקרת לשמש", "אני יודעת שזה קשה. במיוחד אנחנו הישראלים, משוגעים על שמש. כדאי שתכניסי את זה לראש: השמש היא אויב מספר אחד של העור שלך! חשיפה לא מבוקרת לשמש מגבירה רדיקלים חופשיים בעור, מעוררת דלקת, פוגעת ישירות במבנה הקולגן וגורמת לצניחת עור, קמטים וכתמי פיגמנטציה. גם אם הנזק לא נראה מיידית, הוא יגיע. תהיי בטוחה בזה.", "טיפול שבועי אישי", "הטיפול היומי בעור כולל הסרת הלכלוך בסוף כל יום ומריחת קרם מתאים. פעם בשבוע מומלץ להעניק לעור טיפול פנים הכולל גם פילינג, מסכת חמר, תרגילי שרירים פשוטים ומועילים, הזנה ולחות. טיפולים אלו מנקים ומזינים את העור, מגבירים את זרימת הדם, שומרים על טונוס השרירים ומעניקים הרגשה טובה. טיפולי הפנים מועילים לאגו ולנשמה, הם מעכבים את תהליך ההזדקנות ופותרים בעיות עור רבות.", "כיצד להכין לעצמך טיפול פנים?", "החליטי מראש באילו תכשירים או חומרים את רוצה להשתמש. פילינג גרגרים עדין לניקוי הנקבוביות והסרת תאי עור מתים על בסיס קרם או ג'ל, מסכת כיווץ וניקוי, שמן עיסוי מזין העשיר בוויטמינים, מסכת הזנה או קרם לחות המתאים לעורך.", "ביצוע טיפול הפנים", "- פני לך 20 דקות לזמן איכות עם עצמך. התחילי בתרגילי מתיחה עדינים של הפנים: נעיצת מבטים נוקבים, שריקה, פעירת פה, העמידי פנים והגזימי בתנועות פניך.", "- משכי את שיערך לאחור והרחיקי אותו מהצוואר והפנים. נקי את פניך משאריות איפור עם מסיר איפור על בסיס שמן שקדים וגזר, נקי את שאר הפנים בחלב פנים וסבון בהתאם לסוג עורך. סיימי עם מי צמחים.", "- עסי בעדינות את עור פניך עם פילינג גרגרים במשך כדקה ושטפי. מרחי בשכבה אחידה מסכת חמר, המשולבת עם מי צמחים לספיחת רעלים ועודפי שומן, ומתאימה לסוג עורך.", "- בזמן ההמתנה את יכולה לשכב בתנוחת שיפוע כאשר הראש מוטה מעט אחורה ולמטה והרגליים נחות על כר גדול. שכיבה בצורה זו תגביר את זרימת הדם לפנים ותעצים את הטיפול.", "- המתיני כמעט עד ייבוש מלא, והסירי בעדינות במים חמימים. עכשיו עסי את פניך בתנועות אחידות וסימטריות ממרכז הפנים כלפי חוץ עם שמן עשיר במשך כחמש דקות. מטרת עיסוי זה הינה לפנות פסולת ממערכת הלימפה הזורמת תחת העור ולהחדיר לעורך חומרים מזינים.", "- הסירי שאריות שמן באמצעות צמר גפן רטוב וסחוט.", "- במידת הצורך סיימי עם קרם המתאים לעורך.", "\"אֶרֶץ חִטָּה וּשְׂעֹרָה וְגֶפֶן וּתְאֵנָה וְרִמּוֹן אֶרֶץ זֵית שֶׁמֶן וּדְבָשׁ\"", "איך", "מתחילים"]}, {"title": "מקום עבודה וציוד", "type": "content", "paras": ["כל אחת יכולה. זה בידיים שלך", "ברוך בואך לעולם מרתק, המכיל שפע חומרים נפלאים - ההופכים בקסם היצירה למוצרי קוסמטיקה טבעיים, בריאים וריחניים. פעם היה זה עולם שרק יחידי סגולה זכו לו, אצילים ואנשי מלוכה. חומרי הגלם היקרים חצו ימים ויבשות ונמכרו בכסף רב. עם תחילת תהליכי התיעוש, עבר עולם זה לידיהם של יצרנים רודפי ממון והפך לכימי ומלאכותי. רובנו צמחנו אל עולם של מוצרים כימיים מלא שפע והיצע, עם מרכיבים שלא יכולנו לקרוא ולהבין, עולם שבו קוסמטיקה בים חיוניים לעור ולשיער מוויטמינים, דרך חומצות אמינו וחומצות שומן החיוניות לגוף וכלה בקרטונואידים ובפלבונואידים (ויטמין P). תכונותיו כמזין את העור והשיער ויתרונותיו כמשקם ומאיץ הגלדה והחלמת פצעים וכוויות, הופכים אותו לא רק למתאים לטיפולי אנטי אייג'ינג, הזנה ושיקום לעור בוגר ועייף למראה, אלא אף לחלק בלתי נפרד מתיק עזרה ראשונה במקרים של כוויות או פצעים.", "שמן גזר . Carrot oil", "גזר, כידוע, מכיל ריכוזים גבוהים של בטא קרוטן, הצובע את השמן בגון כתום. שמן התשרית מופק לרוב בשמן שקדים, סויה או חוחובה. שמן גזר מכיל פרו-ויטמין A, ויטמין E וקרטנואידים ההופכים אותו למתאים במיוחד להחייאת עור מבוגר, עייף, מקומט וחסר לחות, לסילוק תאי העור המתים ולטיפול בדלקות עור וברגישויות שונות.", "שמן זרעי דלעת. Pumpkin seeds oil", "שמן זרעי הדלעת מופק מגרעיני הדלעת הטעימים בכבישה קרה וצבעו ירקרק - אדמדם. השמן עשיר וסמיך, ומכיל שפע אבץ, פרוטאינים ושפע של ויטמינים מקבוצת ויטמיני ה-B. בשימושו בקוסמטיקה, יעיל למגוון פורמולות המטפלות במצבים שבהם העור יבש או פגום ונזקק לשיקום, להזנה ולחידוש שלו.", "שמן זרעי ענבים . Grape Seed Oil", "שמן זרעי הענבים מהווה תוצר לוואי של תעשיית היין - הוא מופק מזרעי הענבים, לאחר שאלה עברו את הכבישה הנדרשת לצורך ייצור יין. תכולת הפנול, הסטרואידים והחומצות החיוניות שבו הופכת אותו למתאים לשילוב בתכשירי טיפוח המיועדים לעור מבוגר ועייף (כקרמים מחדשי תאים וקרמים אנטי אייג'ינג) ולשיקום שיער עדין, פגום ויבש. כמו כן, ניתן להשתמש בו כמסיר איפור מעולה, בשל היכולת שלו להזין את העור ולשמור על לחותו (האובדת, לרוב, בעת הסרת האיפור). בעל צבע ירוק עמוק וניחוח אופייני ומשגע של ענבים.", "שמן זית . Olive oil", "שמן זית בכבישה קרה הנפוץ בכל בית הינו אחד השמנים הנפלאים לטיפול והזנה לעור יבש ומגורה, שיקום לשיער יבש ומפוצל וטיפולי עיסוי לשרירים תפוסים. מכיל שפע של ויטמין E ואומגה 9 משמש לטיפול לעור יבש, בוגר ומוזנח ובמסכות שיקום והזנה. מתאים לשימוש חופשי בכל מוצרי הגוף והשיער.", "שמן חוחובה . Jojoba Oil", "בניגוד לסוגי שמנים אחרים, שמן החוחובה מוגבל אך ורק לשימוש חיצוני, וזאת, בשל מצבו השעוותי. שעווה זו מופקת מגלעיני החוחובה - צמח הגדל באקלימים חצי-מדבריים. שמן החוחובה מכיל נוגדי חמצון וחומר טבעי דמוי קולגן, ההופכים אותו למתאים במיוחד לשילוב בתכשירי טיפוח המיועדים לעור בוגר ועייף ולשיער הזקוק לזריקת מרץ לאחר צביעות תדירות ותכופות. בנוסף, משמש שמן החוחובה כחומר הגנה לעור ולשיער מפני השמש ונזקי מזג האוויר האחרים.", "שמן אגוז מקדמיה . Macadamia Oil", "שמן המופק מאגוזים הגדלים על עץ מקדמיה, שמקורו באוסטרליה. כבישה קרה של האגוזים תבטיח לא רק את השמירה על הארומה האופיינית (והנהדרת), אלא גם את השמירה על רמת חומצת השומן הפלמיתית הגבוהה באגוז, הנחשבת לחיונית למניעת התחמצנותם של תאים. השמן מתאים לשימוש קוסמטי בעיקר עבור עור יבש או בוגר, והוא משולב בקרמים לפנים ולגוף שמטרתם לחוח, הזנה והחייאת העור, בקרמים נגד קמטים ואנטי אייגינג.", "שמן נר הלילה . Evening Prime Rose oil", "נחשב לאחד מהשמנים היעילים ביותר לטיפול בקמטים ואנטי אייגינג. שמן נר הלילה מכיל רמה גבוהה של חומצה לינולאית וחומצה גמא לינולנית המזינות את תאי העור בלחות חיצונית ופנימית ומחיות אותם. השמן ידוע ביכולות חידוש העור שלו ובהעלמת צלקות וקמטים. תכונות ההופכות אותו למתאים במיוחד בטיפולי האנטי אייג'ינג, ובשילוב בקרמים ללחות, הזנה ושיקום העור. גם הסובלים ממצבי עור בעייתי (כמו למשל קשקשת-עור, אקזמה, סבוריאה וגירויי עור שונים) ייהנו מהשימוש השוטף בו.", "שמן קלנדולה . Calendula Oil", "שמן הקלנדולה הינו למעשה שמן תשרית המופק מפרחי צפורני החתול, לרוב בשמן שקדים מתוקים. תכונותיו המופלאות של השמן הזה כאנטיספטי וכמאיץ את התחדשותם של תאי העור הופכות אותו למתאים במיוחד לטיפול בעור יבש וסדוק, אקנה ואיחוי צלקות, לשיכוך כוויות שמש, לטיפול בפריחה הנגרמת מחיתולים, להרגעת פטמות סדוקות, לטיפול בטחורים, בפיסורה ובעוד רשימה ארוכה למדי של בעיות עור ורגישויות שונות.", "שמן רוז היפ . Rose Hip Oil", "שמן רוז היפ מופק מזרעי פרי שיח ורד הבר הגדל באירופה ובדרום אמריקה. השמן בעל גוון כתום – אדום עשיר בריכוז גבוה של נוגדי חמצון (כדוגמת הוויטמינים C, E ו-A). בניגוד לשמנים עשירים אחרים, הוא אינו מותיר תחושת שמנוניות כבדה על העור, ונחשב לטיפול מעולה לצורך ריפויים והעלמתם של צלקות וחתכים. בקוסמטיקה, בשל תכונותיו המזינות והמרפאות, הוא משולב בתכשירים נגד קמטים, לקרמים לפנים ולגוף לטיפול ביובש, למוצרים לתינוקות ועוד. הטיפול בשמן מתאים לכל סוגי העור, גם לעור שמן.", "שמן שקדים מתוקים . Sweet Almond Oil", "שמן שקדים נחשב לשמן רב שימושי ופופולארי מאוד, הן בקרב מעסים מקצועיים והן בקרב חובבי הקוסמטיקה הטבעית. הוא כמעט חסר ריח או צבע, מה שהופך אותו למתאים במיוחד לשילוב כשמן הבסיס בתכשירי עיסוי וריכוך העור, לתכשירי לחות והזנה לעור הפנים והגוף ולרשימה ארוכה של תכשירים, בהם הוא משמש כשמן נשא ומבליט את תכונות השמנים הנוספים המרכיבים את הפורמולה."]}, {"title": "חמאות צמחיות", "type": "content", "paras": ["חמאות צמחיות הן למעשה שמנים צמחיים, שהינם מוצקים בטמפרטורת החדר. כמו השמנים הצמחיים, גם החמאות מכילות רכיבים חיוניים רבים. יתרונן מצוי במבנה המוצק שלהן ובעובדה שהן נמסות בקלות במגע עם העור. עבודה עם חמאות צמחיות נפוצה בתחום הארומתרפיה לעיסויים, לטיפולי רפלקסולוגיה וכן בתחומי הקוסמטיקה והקוסמטיקה הטבעית.", "כל חמאה צמחית מאופיינת במרקם שונה. לדוגמה, חמאת דקל היא רכה, קוקוס בקיץ נוזלית ובחורף מוצקה מאוד, ואילו קקאו מוצקה מאוד. כאשר רוצים לעבוד עם חמאות מוצקות, לשלב ביניהן ולהכין מהן תכשירים, יש להמיסן קודם בבאן מרי, לאחר מכן להוסיף את התוספות כגון השמנים הארומטיים, ואז למזוג לצנצנת ולהניח להתקרר ולהתקשות. תוכלי לשלב בין החמאות השונות, להוסיף להן שמנים צמחיים נוספים, לתבל בניחוחות כיד הדמיון ולהכין משחות, שפתונים, סבונים, נרות עיסוי, קרמים, חמאות גוף ועוד.", "שמן דקל . Palm oil", "שמן הדקלים מופק מרסק ציפת פרי של עצי Elaeis Guineensis וצבעו אדמדם (כאשר הוא בכבישה קרה ואינו מזוכך), בשל התכולה הגבוהה של בטא קרוטן המצויה בו. הוא מכיל כמות גבוהה של חומצות שומן רוויות המתמצקות בטמפרטורת החדר, כך שהשימוש בו מתחיל בהיותו מוצק-למחצה. שמן דקלים משולב בתכשירי הטיפוח כשהוא משמש כבסיס למוצרי הטיפוח להזנת עור ושיער יבשים וחסרי ברק. עוד משמש השמן כשמן עיסוי, ומשולב במוצרי טיפוח לעור התינוק, בשמנים שמטרתם הרגעת העור ולחוחו לאחר שיזוף ובשפתוני הגנה.", "חמאת שיאה . Shea Butter", "חמאת שיאה מופקת באמצעות כבישה קרה של גלעיני השיח, שמקורו בסודן ובאפריקה המערבית. הרכב השומנים, הוויטמינים והמינרלים החיוניים המצוי בה, הופך את חמאת השיאה לבסיס הטבעי לאינספור מוצרים ותכשירים, הן בתחומי הקוסמטיקה המסחרית, הן בתחומי הקוסמטיקה הטבעית והן בתחומי הרפואה האלטרנטיבית. רשימת החומצות החיוניות המצויות בחמאה הינה ארוכה, מרשימה ומועילה, כך שלא רק בתחום הקוסמטי נעשה בה שימוש, אלא שגם בתחום הטיפול בעור פגוע, פגום או מצולק מככבת חמאת השיאה ותופסת מקום של כבוד וניתן לעשות בה שימוש חופשי בכל מוצר או למרוח אותה על גבי העור כפי שהיא.", "חמאת קקאו . Cocoa Butter", "חמאת הקקאו (או שמן תאוברומה) היא השמן צמחי טבעי אכיל המופק מפולי קקאו. בניגוד למחשבה המשתמעת, צבעה אינה חום אלא צהבהב חיוור והניחוח העדין מסגיר את הקשר לשוקולד, גם כשהיא משולבת במשחות ובתמרוקים. חמאת הקקאו מכילה שפע של נוגדי חמצון עוצמתיים (מה שמעמיד את אורך חיי המדף שלה לכחמש שנים), ויטמינים ומינרלים הזמינים לעור. בדומה לחמאות האחרות המשמשות אותנו בהכנת תכשירים, היא נמסה בקלות במגע עם העור (בשל הטמפרטורה), כשהיא נספגת בקלות ומותירה מגע קטיפתי לעור.", "שמן קוקוס . Coconut Oil", "שמן הקוקוס מופק מציפת (ה\"בשר\") פרי העץ, ובצורתו המזוככת הוא מגיע בצורת משחה (תודות לתכונת ההתקרשות שלו בטמפרטורה הנמוכה מ-20 מעלות). לשמן הקוקוס רשימה ארוכה של ערכים ותכונות, שהופכות אותו, ככל הנראה, לשמן הנפוץ ביותר בשימוש הקוסמטי הביתי. הוא מזין את העור והשיער, מרגיע גירויים בעור, ואף שימושים פחות שגרתיים (למשל, כתחליף לקצף גילוח) כבר הוצמדו אליו. ריחו הנעים, אף הוא, מעודד את השימוש בו, הן בשעות היום והן להזנת העור בשעות הלילה."]}, {"title": "שמנים אתריים", "type": "content", "paras": ["שמנים אתריים. ארומה מנצחת", "שמנים אתריים אינם באמת שמנים כי אם תמציות אתריות מרוכזות, המופקות מהצומח ומכילות את התכונות החיוביות והחיוניות של הצמח, מבלי שניזוקו או נפגעו מתהליכים שונים. התמציות האתריות הן בעלות מולקולות קטנות, נדיפות וריחניות, מה שהופך אותן ליעילות מאוד בעולם הקוסמטיקה ואסתטיקת הגוף. השמנים האתריים משמרים את תכונותיו של החומר המגן על הצמחים מפני נזקי הסביבה, נזקי אקלים ונזקי בעלי חיים הניזונים מהם. כאשר אנו משתמשים בהם, הם מסייעים לגוף להגן על עצמו מפני אותם מזיקים ומפגעים פוטנציאליים. השמנים האתריים משמשים כיום בתחום הארומתרפיה, בתעשיית התרופות והבשמים, וגם בתעשיית המזון כחומרי טעם וריח טבעיים.", "קיימים סוגים רבים של תמציות אתריות, המופקות מעשרות סוגי צמחים, פרחים ועצים. בעולם מצויים בשימוש מאות שמנים אתריים, בעוד שבישראל נפוצים לשימוש כ 50- בקירוב. כל אחד מהם הוא בעל תכונות שונות המסייעות לפתרון נזקי עור, לשיפור תהליכים פנימיים בגוף או לשיפור מצב נפשי, ורובם מסייעים במקביל לכמה תהליכים בו זמנית.", "לפניך 15 שמנים אתריים נפוצים, בטוחים ונפלאים לשימוש, המכסים את כל הצרכים בשימוש בקוסמטיקה הטבעית.", "איך משתמשים", "השמנים האתריים הם טהורים ועוצמתיים, ואין להשתמש בהם ישירות על העור אלא לדללם בשמן צמחי או קרם בסיס לפני השימוש. המינון המומלץ לשימוש קוסמטי הוא כ -5-10 טיפות מהתמציות שבחרנו לכל 50 מ\"ל שמן או קרם.", "מומלץ מאוד, לפני שימוש בתוספים טבעיים מעין אלו, לוודא כי:", "• מדובר אכן בשמנים אתריים טהורים במלוא מובן המילה.", "• בחרנו שמן אתרי המותאם לבעיה ספציפית קיימת והוא מתאים עבורנו.", "• אנו מקיימים את הוראות השימוש כלשונן, אלא אם מדובר במוצר שלגביו אין הגבלת שימוש או תנאים מיוחדים.", "למען ביטחונכם האישי ושמירה על חיי המדף של השמנים האתריים, הקפידו על מספר כללים", "• שימו לב לאיסורים ולאזהרות לפני שאתם משתמשים בשמנים:", "ישנם שמנים אשר אינם מתאימים לשימוש בהיריון, בלחץ דם גבוה, בחשיפה לשמש, לילדים, לנוטלים תרופות וכדומה.", "• הרחיקו בקבוקונים מילדים ומבעלי חיים.", "• דללו תמיד בשמן נשא או בקרם לפני השימוש.", "• הרחיקו את השמנים ממקור אור וחום.", "• הקפידו לסגור היטב את הבקבוקונים.", "אשכולית . Grapefruit", "שמן האשכולית נחשב לשמן מרענן ומעורר, בעוד שבעת השימוש הקוסמטי בו מתגלות תכונותיו הרבות והמופלאות - הוא ממצק את העור ומעניק לו נפח, מתאים לטיפול בעור השמן הסובל מאקנה ומדלקות עור, בדיוק באותה המידה שהוא מתאים לריענון עור בוגר, נפול ועייף למראה. הוא בעל יכולת לעצור דימומים, להקל בטיפולים בצלוליט, מפיג ריחות רעים ומפזר הצטברויות נוזלים ונפיחויות. חשוב! - אין להיחשף לשמש לפחות 12 שעות לאחר השימוש.", "אילנג אילנג . Ylang Ylang", "מאזן את הפרשת החלב בעור ולכן הוא נחשב לאידיאלי לטיפול באקנה בעור שמן. את העור היבש, לעומת זאת, הוא ירענן ויעניק לו מראה חיוני ובריא. הוא משתלב באופן מושלם במגוון מוצרים כמו קרם פנים, סרומים, תערובות שמנים, שמני עיסוי ועוד. הארומה שלו משתלבת באופן מושלם עם שמנים אתריים כמו לימון, לבנדר וסנדלווד, כאשר מומלץ לשלבו בשמנים נוספים ולא להשתמש בו לבד. שימו לב - זהו שמן חזק, מספיקות טיפה או שתיים בכל פורמולה על מנת ליהנות מהיתרונות שהוא מביא איתו.", "גרניום . Geranium", "שמן הגרניום מתאים לטיפול ולטיפוח של כל סוגי העור. לשמן תכונות אנטיספטיות, אנטי דלקתיות ואנטי פטרייתיות מובהקות. הוא משיב ברק לעור יבש ועייף, מאזן את הפרשת החלב בעור שמן ובעייתי, משפר את זרימת הדם בנימים ומעניק לעור זוהר נעורים מחודש. הוא מתאים לטיפול בפצעי אקנה ובכוויות, מעולה לטיפול ואיזון מגוון פתולוגיות עור כמו דרמטיטיס, פסוריאזיס, סבוריאה ואקזמה. מתאים לכל סוגי העור. השמן משתלב היטב עם השמנים האתריים הלימוניים, לבנדר, יסמין, רוז ושמן נרולי.", "רוז – ורד בולגרי . Bulgarian Rose", "מעבר לארומה האופיינית של השמן הריחני הזה, ההופכת אותו לאחד מהמבוקשים ביותר בשימוש בתמרוקים, יש לו גם לא מעט תכונות ההופכות אותו ליעיל בתחום הקוסמטיקה - הוא אנטי דלקתי ומאיץ את התחדשות תאי העור, ומתאים במיוחד לטיפול בעור יבש, עייף או מבוגר, לטיפולי אנטי אייג'ינג ולאזורים רגישים, דוגמת האזור שסביב העיניים. השמן משתלב נפלא עם שמני הלבנדר, הגרניום, האילנג אילנג והסנדלווד, וניתן להשתמש בו בפני עצמו כבושם (מדולל בחוחובה) ישירות על עורכם.", "לבונה . Frankincense", "השמן נחשב לשמן המושלם עבור מוצרי קוסמטיקה וטיפוח לעור בוגר, ובשל עדינותו, הוא מתאים גם לשימוש בתינוקות ובנשים הרות. הוא נחשב כיעיל בטיפול בסימני מתיחה, בטיפול בפצעים ובחבורות, ויעיל במיוחד בטיפול במחלות העור השונות ובגירויי עור הנגרמים מסיבות מגוונות. לעור המבוגר והעייף, תועלתו גדולה במיוחד, משום שהוא מצליח לטפל בהצלחה בקמטים ולהפוך את מראהו של העור לבוהק, צעיר ומלא חיים. השמן משתלב באופן מעולה עם שמן אתרי לבנדר, שמן הגרניום, התפוז או המנדרינה.", "לבנדר . Lavender", "שמן הנחשב לשמן הראשון שאליו תגיעו כשיש לכם בעיה כלשהי בעור, בין אם מדובר בגירוי או בגירוד כתוצאה מעקיצה או מאלרגיה ובין אם המדובר בחתך, כוויה או פצע. באספקט הקוסמטי שלו, משרת שמן הלבנדר את מטרת הרגעת העור במלואה, הוא מרגיע, מטשטש צלקות ומחדש את תאי העור. גם הצלחתו בתחום בעיות העור הכרוניות אינה מוטלת בספק, שכן אופן טיפולו בקופרוז, בפסוריאזיס ובאקזמה נחשב ליעיל ביותר. הוא בעל 0% סיכון לרעילות וניתן להשתמש בו ישירות על העור גם כאשר הוא אינו משולב בשמן נשא.", "נרולי . Neroli", "בנוסף לארומה המשכרת שלו, ניחן שמן הנרולי בלא מעט תכונות קוסמטיות. הוא אנטי בקטריאלי ואנטי דלקתי, מזרז את זרימת הדם, מחדש רקמות, מותח עור ומיישר קמטים, מטפל בעור יבש, חסר חיים ובוגר ומעניק לו זוהר בריא ורענן, מעלים צלקות וסימני מתיחה, מרגיע גירויים וכוויות בעור, ובכלל - נחשב לאולטימטיבי בכל הנוגע לתכשירי אנטי אייג'ינג. שמן הנרולי משתלב בשמנים האתריים הלימוניים, בלבנדר, ביסמין ובוורד.", "לימון . Lemon", "ריחו הלימוני מסגיר אותו מרחוק, אבל בנוסף לארומה המהממת שלו, לשמן אתרי לימון ישנם לא מעט יישומים בקוסמטיקה הטבעית. הוא מבהיר כתמי עור, מחטא, מחדש תאי עור ורקמות, מתאים במיוחד לטיפול בעור שמן, ומעולה לטיפול במחלות עור ובנגעי העור השונים כדוגמת יבלות, קשקשים, אבעבועות הקור ופסוריאזיס. השמן משתלב מעולה בלבנדר, ארז, גרניום, סנדלווד ובשמנים האתריים הלימוניים. בדומה לשמני ההדרים האחרים, גם שמן הלימון עלול לגרום לגירויים בעור הרגיש, והוא פוטוסנסטיבי, ולכן, יש להימנע מחשיפה לקרני השמש כ-12 שעות לאחר השימוש בו.", "סנדלווד . Sandalwood", "לשמן הסנדלווד תכונות טובות בשפע, אשר מרביתן, אף באות לידי ביטוי באספקט הקוסמטי שלו. לשמן תכונות אנטיספטיות ואנטי דלקתיות, והוא נחשב למרגיע ומשקם עבור כל סוגי העור הקיימים. הוא מתאים לעור בעייתי, שומני ומזיע, בדיוק באותה רמת התאמה שהוא מתאים לעור היבש והמקומט. השמן משתלב היטב עם שמן ברגמוט, גרניום, מור, לבנדר, רוז, ואילנג אילנג. לא מומלץ להשתמש בו כשהוא לכשעצמו, אלא יש לדללו בפורמולה הכוללת לפחות שמן אתרי אחד נוסף.", "מנדרין . Mandarin", "שמן מנדרין משפר את זרימת הדם בגוף ואת התפקוד הלימפתי, במיוחד תחת העור, תכונה המסייעת למשתמש בו לשמור על מראה עור צעיר יותר. השמן אף מזרז צמיחתם של תאים ורקמות עור חדשות, וכתוצאה מכך, מקצר את זמן ההחלמה של פצעים, צלקות, סימני המתיחה וסדקים בעור. השמן מוכר כמרגיע אדמומיות וגירויים, מבהיר עור קליל ומאזן עור שמן ורגיש. השמן משתלב באופן מושלם עם מרבית השמנים שמקורם בפירות ההדר האחרים ועם ברגמוט, לבונה ולבנדר. אזהרות - השמן פוטוסנסטיבי, ולכן, יש להימנע מחשיפה לקרני השמש כ-12 שעות לאחר השימוש בו.", "עשב לימון . Lemongrass", "שמן עשב הלימון נחשב לשמן יעיל בשל ת type": "content", "paras": ["חמרים. מתנת האדמה", "כבר אלפי שנים שהחֵמַרים (Clay) מהווים חלק בלתי נפרד מטיפולי היופי. הם ידועים כמרחיקי רעלים מהעור, מרחיקים עודפי שומן, מזינים את העור בוויטמינים ומינרלים, משפרים את מרקם העור ומותירים אותו חלק ונעים.", "החמרים הינם למעשה אבקות חרסית. הם מגיעים ממקומות שונים בעולם, בעלי צבעים שונים, תכונות מינרלים שונה והשפעה שונה על העור. בחמרים ניתן להשתמש בטיפולי פנים ובטיפולי גוף, לאבקות גוף, וכתוספת צבע טבעי לסבונים, משחות, קרמים, מלחי אמבט ועוד. השימוש בחֵמַר להכנת מסכה הינו פשוט ונוח. בוחרים את החמר המתאים לסוג העור, מוסיפים מים או מי פרחים, מערבבים לעיסה אחידה ומורחים על הפנים או על הגוף. יש להניח לחמר להתייבש כ 10- עד 15 דקות ולאחר מכן לשטוף. לסיום מומלץ להשתמש בקרם לחות או בקרם גוף האהוב עליך.", "חמר ירוק", "החימר ירוק הוא מהרכיבים הטבעיים היעילים ביותר עבורנו הקיימים בטבע והשימוש בו נחשב למקובל, נפוץ ופופולארי עד מאוד בתעשיית הקוסמטיקה הטבעית וטיפוח הגוף.", "חימר ירוק מכיל הרבה מאוד מרכיבים המספקים לעורנו חוסרים קיימים, שקשה לקבל בצורה מרוכזת וממוקדת בדרכים אחרות כגון מגנזיום, סידן, אשלגן ועוד רכיבים ואלמנטים מגוונים. החידוש הגדול ביותר בחמר זה הוא הכלת רקב אצות, המעניק לו את צבעו הירוק, ובו ריכוז של אנרגיית שמש וויטמינים המתקבלים על ידי אור השמש וקרניה. החמר הירוק בעל יכולת ספיחה חזקה ומומלץ לשימוש במסיכות לעור אקנתי, שמן ומעורב.", "חמר מרוקאי", "אבקת משי בגוון אפור בהיר עם רמז של ורוד. החמר המרוקאי עשיר במינרלים כגון סיליקה בכמות גבוהה מאוד, מגנזיום, סידן. הוא ידוע ברחבי עולם הספא בטיפולי ניקוי, הזנה, פילינג והתחדשות העור.", "לחמר המרוקאי יחס ספיגה גבוה ובשילוב מי צמחים הופך לאמצעי ניקוי נפלא, והינו תחליף לסבון ושמפו לבעלי עור רגיש המעוניינים בניקוי טבעי. התחושה שהוא מותיר על העור הינה תחושה עדינה חלקה ונעימה. מצוין לטיפול בקרקפת.", "חמר ורוד", "החמר ורוד נחשב לעדין ונהדר עבור סוגי עור שונים כאשר יש לו את היכולת להשפיע על ריכוך העור, לשפר את מרקמו ולספק לחות. בנוסף החמר הורוד בעל יכולת למצק את העור ולשפר את רקמות החיבור שלו. נהדר לשימוש עבור עור בוגר, רגיש ועדין.", "חמר לבן", "אבקה לבנה אוורירית וקלה הנוצרת משקיעה של סלעים הנשטפים עם מי גשמים. לחמר הלבן תכולה גבוהה של אלומיניום טבעי מהאדמה ורמת pH מאוזנת של 5 . מבחינת יכולת הספיגה החמר הלבן נחשב לעדין ולכן מתאים לשימוש לעור רגיל ויבש ומעניק מראה אחיד, בהיר ונקי לעור הפנים.", "אדמת חוואר", "אבקת חוואר או חמר צהוב זו אדמה בעלת גוון צהוב - חרדל הנפוצה גם בישראל. היא בעלת יכולת ספיחת רעלים מצוינת ולכן מתאימה לטיפולים שוטפים עבור כל סוגי העור. נהוג להשתמש בה גם כמסכה לפנים וגם לטיפולי גוף. נפוצה במשחות שיניים טבעיות לטיפול ושמירה על היגיינת הפה."]}, {"title": "גרגירים לפילינג", "type": "content", "paras": ["מוצרי פילינג (מירוק, בעברית; Exfoliants בלעז) הם תרכובות המסוגלות להשיל מהעור את השכבה העליונה של תאי עור מתים, ובכך ליצור חידוש ותחלופת תאים בעור ולהותיר אותו נקי, חלק, רענן ופחות מקומט. עולם הפילינגים מתחלק לשלושה:", "פילינג מכני – מכיל גרגרים שאיתם מעסים את העור ובכך יוצרים את תהליך המירוק.", "פילינג אנזימטי – שימוש באנזימי עיכול המסוגלים \"לעכל\" בעדינות את תאי העור המתים בשכבה העליונה של העור. דוגמה לאנזימים טבעיים: פפאין הנמצא בפפאיה וברומלין הנמצא באננס.", "פילינג חומצות – מה שרובנו מכירים כאלפא בטא הידרוקסי. חומצות אלו לרוב מסונתזות במעבדה, וכחומרי גלם טהורים הן עלולות להיות מזיקות בשימוש לא מבוקר. בטבע נוכל למצוא אותן לדוגמה בחלב – חומצה לקטית, ובלימון – חומצה ציטרית.", "פילינג מכני נפוץ בשימוש הביתי. ניתן להכינו בקלות ולהשתמש בגרגרים שונים הנמצאים אצלנו במטבח: קוואקר, סוכר, מלח, קפה, תבלינים, קטניות טחונות ועוד. ניתן לשלב גרגרים עם שמן, קרם ומים, ולעסות בעדינות את עור הפנים והגוף.", "חשוב להתאים את גודל הגרגרים לסוג עורך. לפנים מומלץ להשתמש בגרגרי פילינג עדינים, ואילו לעור הגוף בגרגרי פילינג גסים יותר. כחלק מהעבודה של הפילינג על עורנו, נוכל לצפות לתחושה חלקה יותר של העור ולמראה אחיד ורענן. מומלץ לעשות פילינג פנים וגוף אחת לשבוע.", "גרגרי אפרסק", "• טחונים מגלעיני אפרסק", "• גרגרים בגודל קטן עד בינוני", "• מתאימים לפילינג לפנים ולגוף", "מלח גס", "• משמש כפילינג בשילוב שמנים", "• מתאים כפילינג גוף גס לאזורים יבשים בגוף כגון מרפקים וכפות רגליים", "גרגרי משמש", "• טחונים מגלעיני משמש", "• גרגרים בגודל קטן", "• מתאימים לפילינג עדין לפנים", "מלח אנגלי", "• מלח דק המשמש כפילינג גוף ובאמבט", "• מושך רעלים, מרכך ומונע כאבי שרירים", "• מרגיע כאבים ראומטיים", "קפה שחור", "• מרכיב נפלא לפילינג", "• ממריץ את העור, מעורר אותו ומאיץ את חידושו", "• בעל ניחוח קפה משגע", "סוכר", "• לבן או חום, לסוגיו השונים", "• מתאים כפילינג נפלא לטיפול בעור הידיים והגוף", "• תורם ללחות בעור"]}, {"title": "צמחי מרפא", "type": "content", "paras": ["לצמחי המרפא שימושים רבים בטיפול בעור וטיפוחו. ניתן למצוא אותם כפרחים, עלים חתוכים, אבקות, כמיצויים מימיים ועוד. פרחים ועלים חתוכים ישמשו להכנת שמני תשרית או להוספה למלחי אמבט, אבקות צמחי מרפא ישמשו לרוב כפילינג או במסכות, ואילו מיצויים מימיים יהיו נהדרים כמי פנים ולהוספה לתכשירים. ניתן להשתמש אפילו בתבלינים מהטבע, כמו קינמון טחון, להכנת פילינגים ריחניים, ממריצים ומושכים מאין כמותם בתקופת הסתיו והחורף.", "ורדים . Rose", "במי ורדים עושים שימוש קוסמטי כבר מאות שנים. למשל באירופה של ימי הביניים עשו בו שימוש לחיטוי ידיים לפני ארוחות חגיגיות, בהודו מורחים אותו על הפנים ועושים בו שימוש כמי לחות. כיום יודעים שלמי ורדים סגולות קוסמטיות מפני שהם מכילים חומרים מרגיעים והם בעלי תכונות מחטאות, אנטי-בקטריאליות ואנטי-דלקתיות כך שהם יכולים לשמש למגוון מטרות, למשל ניקוי הנקבוביות בפנים, ניקוי העור, ריפוי של צלקות, פצעים וחתכים, טיפול בדלקות עיניים ועוד.", "קלנדולה Calendula", "צמח הקלנדולה, המכונה גם \"ציפורני החתול\", הוא בעל סגולות בריאותיות רבות. זהו צמח אנטי דלקתי מובהק הניחן ביכולת להאיץ את התחדשות תאי העור והטיפול בו. משתמשים בו רבות לטיפול בתפרחת חיתולים, לטיפול בפטמות סדוקות עקב הנקה ובעור מגורה או פצוע. ניתן להשתמש בקלנדולה כשמן או כחליטה לטיפול באקנה ובכוויות, ולטיפול בעור האישה ההרה ובעור התינוק.", "קמומיל (בבונג) . Chamomile", "מדובר באותו קמומיל שאנו לרוב שותים כחליטה להרגעת מערכת העיכול ולהרגעה בכלל. הקמומיל משמש לטיפול בעור רגיש ויבש, הוא מרגיע את העור ומוסיף לו לחות, מזרז חידוש רקמת עור, מאיץ ריפוי פצעים ומעכב תהליכי הזדקנות. בזכות תכונותיו אלו הוא מתאים לטיפול בכל בעיית עור, לאקנה ולעור מגורה ובעיות עור כרוניות. ניתן להשתמש בהדרוסול קמומיל או בחליטת קמומיל במסכות בשילוב חמרים או כמי פנים על בסיס יומיומי.", "הידרוסול הוא תוצר לוואי של תעשיית השמנים האתריים. בתהליך הפקת שמן אתרי בזיקוק מתקבל מעט שמן אתרי טהור, ובצידו כמות נכבדת של מי צמחים המכילים את כול תכונות הצמח ונפלאים לשימוש ארומתי וקוסמטי.", "אלוורה . Aloe Vera", "ג'ל האלוורה כולל את כל אבות המזון הנחוצים לתזונה האנושית, כ- 12 סוגים של וויטמינים, כ-20 סוגים שונים של מינרלים, 18 חומצות אמינו ועוד שפע של חומרים צמחיים פעילים כמו סוכרים ואנזימים. הודות לשלל החומרים האלו לג'ל האלוורה יכולת מוכחת לחדש תאים פגועים, לחטא, לייבש לחות ולפעול כנגד פטריות, וירוסים ובקטריות, וכן לטפל בעקיצות, גירויים, כוויות, אקזמה, פסוריאזיס, סבוריאה ועוד. לא פלא שהצמח זכה לכינויים שונים לאורך השנים, למשל המצרים הקדמונים קראו לו \"צמח האל-מוות\", ואילו האינדיאנים באמריקה קראו לו \"שרביט גן העדן\".", "לבנדר . Lavender", "לבנדר, אותו צמח רב-גוני ומועיל, שאין חברת קוסמטיקה, אווירה או מוצרי ניקוי לבית, שאיננה מציעה ללקוחותיה לפחות תכשיר אחד בריחו הענוג, נחשב לאחד מהצמחים המועילים ביותר בתחום הקוסמטיקה הטבעית. פרחי הלבנדר הינם ארומטיים ובעלי ניחוח נפלא ומלבלב וישתלבו נפלא במלחי אמבט, כריחן מבשם לארון הבגדים או כחליטה מפנקת ומרגיעה. חליטת לבנדר או הדרוסול לבנדר ישמשו גם כחומר חיטוי עדין לעור וכמי פנים נפלאים לעור שמן ומעורב.", "הממליס . which hazel", "היישר מצפון אמריקה מגיע אלינו הצמח המוכר לנו בשם הממליס, או, בשמו העממי יותר \"אגוז המכשפה\" (Witch Hazel). צמח זה מספק לנו מגוון רחב של אפשרויות טיפול, שיקום וריפוי ומשמש ככלי משמעותי בכל מה שקשור לעולם של צמחי מרפא ומוצרי קוסמטיקה טבעיים. הממליס הוא בעל יכולת מופלאה לכווץ ולאלחש ובכך הוא מרגיע את תחושת הגירוי ומעכב תהליכים דלקתיים. תכונות אלו הופכות אותו לנפלא לטיפול באקנה, בעור הגבר לאחר גילוח, טחורים ופיסורה."]}, {"title": "חומרי גלם בסיסיים ופעילים", "type": "content", "paras": ["רגע לפני שאת מתחילה: כדי שתוכלי ליצור את מוצרי הקוסמטיקה שלך בעצמך, תזדקקי בחלק מהמקרים לשימוש במספר חומרי גלם בסיסיים וחשובים. למשל, אם תרצי להכין לעצמך קרם פנים או גוף, תזדקקי לקרם בסיס על מנת שתוכלי להכינו בעצמך. עבור מוצרים על בסיס מים, כדאי להחזיק ג'ל בסיס. אלו הם החומרים הבסיסיים הע
