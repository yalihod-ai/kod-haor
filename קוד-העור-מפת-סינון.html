function listBlock(items, cls){
  var html='', open=false;
  items.forEach(function(it){
    if(it.t==='cat'){ if(open){html+='</ul>';open=false;} html+='<div class="catname">'+esc(it.x)+'</div>'; }

  if(open) html+='</ul>';
  return html;
}

    +'<button class="addbtn" onclick="addProduct()">הוספה למפה שלי +</button>'
    +'<div class="saved" id="savedMsg"></div>'
    +'</div><div id="prodList"></div></div></section>';
  h+='<div class="wrap"><div class="golden"><div class="lbl">כלל הזהב</div>';
  d.golden.forEach(function(g,i){ h+= i===0 ? '<p>'+esc(g)+'</p>' : '<div class="foot">'+esc(g)+'</div>'; });
  h+='</div></div>';
  h+='<section><div class="card summary tool"><h2>הסיכום <span class="g">האישי שלי</span></h2>'
    +'<p class="intro">אחרי שסיננת את המגירה, כתבי לעצמך:</p>'
    +'<div class="row"><label>שלושת המוצרים שאני משאירה</label>'
    +'<input data-k="keep1" placeholder="1"><div style="height:8px"></div><input data-k="keep2" placeholder="2"><div style="height:8px"></div><input data-k="keep3" placeholder="3"></div>'
    +'<div class="row"><label>שני מוצרים שאני משהה כרגע</label>'
    +'<input data-k="pause1" placeholder="1"><div style="height:8px"></div><input data-k="pause2" placeholder="2"></div>'
    +'<div class="row"><label>מוצר אחד שאפשר להחליף במתכון טבעי</label><input data-k="replace1" placeholder="..."></div>'
    +'<div class="row"><label>הדבר המרכזי שהבנתי על שגרת הטיפוח שלי</label><textarea data-k="insight" rows="3" placeholder="..."></textarea></div>'
    +'<div class="saved" id="sumSaved"></div></div></section>';
  h+='<div class="wrap"><p class="closing">המטרה היא לא שתהיה לך מגירה מושלמת. המטרה היא שתהיה לך שגרה שאת מבינה. כשאת יודעת מה העור שלך צריך, קל יותר להבין מה להשאיר, מה להשהות, מה מיותר — ומה באמת יכול לתמוך בעור שלך עכשיו.</p></div>';
  h+='<section style="text-align:center"><a class="pdfbtn" href="'+pdf+'" target="_blank" rel="noopener">⬇ הורדת המפה כ-PDF (לעבודה על הנייר)</a></section>';
  document.getElementById('content').innerHTML=h;
  renderProducts(); loadSummary();
}

function sel(id,key){
  var o='<select id="'+id+'"><option value="">בחרי…</option>';
  OPT[key].forEach(function(v){o+='<option>'+v+'</option>';});
  return o+'</select>';
}
function pkey(){return 'kh_drawer_products';}
function getProducts(){try{return JSON.parse(localStorage.getItem(pkey())||'[]');}catch(e){return [];}}
function setProducts(a){try{localStorage.setItem(pkey(),JSON.stringify(a));}catch(e){}}
function val(id){return document.getElementById(id).value;}
function addProduct(){
  var name=document.getElementById('f_name').value.trim();
  if(!name){document.getElementById('savedMsg').textContent='כתבי שם מוצר כדי להוסיף.';return;}
  var p={name:name,type:val('f_type'),role:val('f_role'),suit:val('f_suit'),feel:val('f_feel'),dec:val('f_dec')};
  var a=getProducts();a.push(p);setProducts(a);
  ['f_name','f_type','f_role','f_suit','f_feel','f_dec'].forEach(function(id){document.getElementById(id).value='';});
  var m=document.getElementById('savedMsg');m.textContent='נשמר ✓';setTimeout(function(){m.textContent='';},1500);
  renderProducts();
}
function delProduct(i){var a=getProducts();a.splice(i,1);setProducts(a);renderProducts();}
function renderProducts(){
  var a=getProducts(),el=document.getElementById('prodList');
  if(!el)return;
  if(!a.length){el.innerHTML='<div class="empty">עדיין לא הוספת מוצרים. התחילי ממוצר אחד 🙂</div>';return;}
  el.innerHTML=a.map(function(p,i){
    var dc=DEC_CLASS[p.dec]||'';
    var meta=[];
    if(p.type)meta.push(p.type);
    if(p.role)meta.push('תפקיד: '+p.role);
    if(p.suit)meta.push('מתאים: '+p.suit);
    if(p.feel)meta.push('תחושה: '+p.feel);
    return '<div class="prod '+dc+'"><div class="top"><span class="pname">'+esc(p.name)+'</span>'
      +(p.dec?'<span class="dec '+dc+'">'+esc(p.dec)+'</span>':'')+'</div>'
      +(meta.length?'<div class="meta">'+esc(meta.join(' · '))+'</div>':'')
      +'<button class="del" onclick="delProduct('+i+')">הסרה</button></div>';
  }).join('');
}
function skey(){return 'kh_drawer_summary';}
function loadSummary(){
  var s={};try{s=JSON.parse(localStorage.getItem(skey())||'{}');}catch(e){}
  document.querySelectorAll('[data-k]').forEach(function(inp){
    if(s[inp.dataset.k])inp.value=s[inp.dataset.k];
    inp.addEventListener('input',saveSummary);
  });
}
function saveSummary(){
  var s={};document.querySelectorAll('[data-k]').forEach(function(inp){s[inp.dataset.k]=inp.value;});
  try{localStorage.setItem(skey(),JSON.stringify(s));}catch(e){}
  var m=document.getElementById('sumSaved');if(m){m.textContent='נשמר ✓';clearTimeout(window._st);window._st=setTimeout(function(){m.textContent='';},1200);}
}
</script>
</body>
</html>
